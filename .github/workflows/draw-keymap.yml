name: Draw keymap

on:
  workflow_dispatch:
  push:
    paths:
      - config/*.keymap
      - config/*.dtsi
      - keymap-drawer.yaml

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install keymap-drawer
        run: pip install keymap-drawer

      - name: Parse keymap
        run: |
          keymap parse -c 10 -z config/corne.keymap > keymap.yaml

      - name: Draw keymap
        run: |
          keymap draw keymap.yaml > keymap.svg

      - name: Upload keymap SVG
        uses: actions/upload-artifact@v4
        with:
          name: keymap
          path: |
            keymap.yaml
            keymap.svg

      - name: Commit keymap SVG (optional)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/mac'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p .assets
          cp keymap.svg .assets/keymap.svg
          git add .assets/keymap.svg
          git diff --staged --quiet || git commit -m "Update keymap visualization [skip ci]"
          git push
